name: DDPM
steps: 100
schedule_cfg:
  beta: [0.0001, 0.01]
  beta_schedule: 'linear'
  s: 0.008
opt_interval: 1
post_physics_iters: 0
post_physics_lr: 0.005
rand_t_type: 'half'
loss_type: 'l2'
morph_aware_grasp_loss: ${morph_aware_grasp_loss}
robot_name: ${robot_name}
sample:
  use_dpmsolver: ${use_dpmsolver}
  name: 'dpmsolver++'
  steps: 10
  order: 1
  skip_type: 'time_uniform'
  t_start: 1
  t_end: 0.01
  method: 'singlestep'
